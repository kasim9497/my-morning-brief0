name: Daily Morning Brief Automated Pipeline

on:
  schedule:
    # 23:30 UTC = 07:30 AM Taiwan Time (Runs daily to ensure readiness by ~08:00 AM)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Permissions required for modern GitHub Pages Actions Deployment & Git Commit
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate and Run Briefing Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          if [ -f "scripts/generate_brief.py" ]; then
            python scripts/generate_brief.py
          elif [ -f "morning-brief-mvp/scripts/generate_brief.py" ]; then
            python morning-brief-mvp/scripts/generate_brief.py
          elif [ -f "generate_brief.py" ]; then
            python generate_brief.py
          else
            echo "Searching for generate_brief.py..."
            SCRIPT_PATH=$(find . -name "generate_brief.py" | head -n 1)
            if [ -n "$SCRIPT_PATH" ]; then
              python "$SCRIPT_PATH"
            else
              echo "Error: generate_brief.py not found!"
              exit 1
            fi
          fi

      - name: Commit Updated today.json to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json || git add **/today.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(brief): auto-update daily brief [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
