name: Daily Morning Brief Automated Pipeline

on:
  schedule:
    # 23:30 UTC = 07:30 AM Taiwan Time (Runs daily to update pages by ~08:00 AM)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches: [main] # 一 push 到 main 就自動重新產生 + 部署，不用等排程或手動點

# ============================================================
# 部署策略：Strategy A（直接部署，不回寫 Repository）
#
#   GitHub Actions
#     ↓ 執行 generate_brief.py
#   產生 today.json（僅存在於 Actions Runner 的工作目錄）
#     ↓ upload-pages-artifact
#   直接打包成 GitHub Pages Artifact
#     ↓ deploy-pages
#   部署到 GitHub Pages
#
# 結論：Repository 裡的 data/today.json 是靜態佔位符（placeholder），
#       它的日期「永遠不等於」GitHub Pages 上的日期，這是正常行為。
#       GitHub Pages 上的 today.json 是由每次 Actions 執行後即時產生的。
# ============================================================

# Permissions required for modern GitHub Pages Actions Artifact Deployment.
# contents: write is needed so the workflow can commit data/exchange_rate_history.json
# back to the repo each run (that's the only file it writes back — today.json itself
# still follows Strategy A above and is never committed).
permissions:
  contents: write
  # 讓內建的 GITHUB_TOKEN 可以呼叫 GitHub Models（免費的 AI 模型，generate_brief.py 用它寫運勢）
  models: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

# Force all JavaScript-based actions to use Node.js 24 runtime
# to suppress the "Node.js 20 is deprecated" warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 日期與排程邏輯的自動測試。沒過就停在這裡，不會把壞掉的版本部署出去
      - name: Run Logic Tests
        run: cd my-morning-brief-apple-design && node --test

      # opencc：簡轉繁（to_traditional），沒裝的話 AI 內容會維持模型回的簡體字
      # ephem：算今天行星的位置、逆行和月相（get_sky_facts），沒裝的話運勢就沒有天象依據
      - name: Install Python Dependencies
        run: pip install opencc-python-reimplemented ephem

      - name: Run Daily Briefing Generation Script
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          # Build metadata injected into today.json → buildInfo
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd my-morning-brief-apple-design && python scripts/generate_brief.py

      - name: Validate Generated today.json Data
        run: |
          cd my-morning-brief-apple-design
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone, timedelta

          try:
              with open("data/today.json", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"❌ ERROR: today.json is not valid JSON: {e}", file=sys.stderr)
              sys.exit(1)

          today_str = datetime.now(timezone(timedelta(hours=8))).strftime("%Y / %m / %d")
          
          # 1. Check Date Freshness
          brief_meta = data.get("briefMeta", {})
          date_in_file = brief_meta.get("date", "")
          if not date_in_file.startswith(today_str):
              print(f"❌ ERROR: today.json date ({date_in_file}) does not match today Taiwan date ({today_str})", file=sys.stderr)
              sys.exit(1)

          # 2. Check Essential Sections & Data Types
          if not isinstance(data.get("user"), dict):
              print("❌ ERROR: 'user' field missing or invalid", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data.get("weather"), dict):
              print("❌ ERROR: 'weather' field missing or invalid", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data.get("exchangeRate"), dict):
              print("❌ ERROR: 'exchangeRate' field missing or invalid", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data.get("drivingQuiz"), list) or len(data.get("drivingQuiz")) == 0:
              print("❌ ERROR: 'drivingQuiz' is missing or not a non-empty array", file=sys.stderr)
              sys.exit(1)

          # 3. Check buildInfo
          build_info = data.get("buildInfo", {})
          run_number = build_info.get("workflowRunNumber", "")
          commit = build_info.get("commitHash", "")
          print(f"✅ BUILD INFO: Actions Run #{run_number} | Commit {commit}")
          print(f"✅ ALL VALIDATIONS PASSED: today.json is valid, fresh ({date_in_file}), and contains all required sections!")
          PY

      # 匯率歷史是目前唯一需要「回寫 repo」的資料（跟 Strategy A 的 today.json 不一樣），
      # 用 [skip ci] 避免這個 commit 又觸發一次 workflow（我們新加的 push 觸發器）造成無限迴圈。
      - name: Commit updated exchange rate history
        run: |
          cd my-morning-brief-apple-design
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exchange_rate_history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update exchange rate history [skip ci]"
            git push || echo "Push failed (likely racing another run) — today's rate will just be picked up on the next run instead."
          else
            echo "No exchange rate history change to commit."
          fi

      # 手機有時會拿到「新的 HTML 配舊的 JS」（各檔案的快取到期時間不同），畫面就會有按了沒反應這類怪現象。
      # 部署前把每個 CSS／JS 的網址都加上這次的 commit 編號，換版時瀏覽器會整組一起重抓。
      # 只改要部署出去的這一份，不會 commit 回 repo，本機開發不受影響。
      - name: Stamp asset URLs with the commit hash
        run: |
          cd my-morning-brief-apple-design
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(from '\.{1,2}/[^']+\.js)'#\1?v=$V'#g" js/*.js js/services/*.js
          sed -i -E "s#(css/styles\.css|js/app\.js|fonts/noto-sans-tc/noto-sans-tc\.css)#\1?v=$V#g" index.html
          grep -c "?v=$V" index.html js/app.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'my-morning-brief-apple-design'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # BUGFIX: Telegram notification now runs AFTER the page is actually live,
      # using the real deployed URL (steps.deployment.outputs.page_url) instead
      # of a hardcoded "your-username" placeholder that was never a real link.
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          cd my-morning-brief-apple-design && python scripts/notify_telegram.py
