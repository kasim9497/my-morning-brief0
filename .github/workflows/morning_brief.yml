name: Daily Morning Brief Automated Pipeline

on:
  schedule:
    # 23:30 UTC = 07:30 AM Taiwan Time (Runs daily to update pages by ~08:00 AM)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches: [main] # 一 push 到 main 就自動重新產生 + 部署，不用等排程或手動點

# ============================================================
# 部署策略：Strategy A（直接部署，不回寫 Repository）
#
#   GitHub Actions
#     ↓ 執行 generate_brief.py
#   產生 today.json（僅存在於 Actions Runner 的工作目錄）
#     ↓ upload-pages-artifact
#   直接打包成 GitHub Pages Artifact
#     ↓ deploy-pages
#   部署到 GitHub Pages
#
# 結論：Repository 裡的 data/today.json 是靜態佔位符（placeholder），
#       它的日期「永遠不等於」GitHub Pages 上的日期，這是正常行為。
#       GitHub Pages 上的 today.json 是由每次 Actions 執行後即時產生的。
# ============================================================

# Permissions required for modern GitHub Pages Actions Artifact Deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

# Force all JavaScript-based actions to use Node.js 24 runtime
# to suppress the "Node.js 20 is deprecated" warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Briefing Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
          # Build metadata injected into today.json → buildInfo
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd my-morning-brief-apple-design && python scripts/generate_brief.py

      - name: Validate Generated today.json Data
        run: |
          cd my-morning-brief-apple-design
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone, timedelta

          try:
              with open("data/today.json", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"❌ ERROR: today.json is not valid JSON: {e}", file=sys.stderr)
              sys.exit(1)

          today_str = datetime.now(timezone(timedelta(hours=8))).strftime("%Y / %m / %d")
          
          # 1. Check Date Freshness
          brief_meta = data.get("briefMeta", {})
          date_in_file = brief_meta.get("date", "")
          if not date_in_file.startswith(today_str):
              print(f"❌ ERROR: today.json date ({date_in_file}) does not match today Taiwan date ({today_str})", file=sys.stderr)
              sys.exit(1)

          # 2. Check Essential Sections & Data Types
          if not isinstance(data.get("user"), dict):
              print("❌ ERROR: 'user' field missing or invalid", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data.get("weather"), dict):
              print("❌ ERROR: 'weather' field missing or invalid", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data.get("exchangeRate"), dict):
              print("❌ ERROR: 'exchangeRate' field missing or invalid", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data.get("aiNews"), list) or len(data.get("aiNews")) == 0:
              print("❌ ERROR: 'aiNews' is missing or not a non-empty array", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data.get("drivingQuiz"), list) or len(data.get("drivingQuiz")) == 0:
              print("❌ ERROR: 'drivingQuiz' is missing or not a non-empty array", file=sys.stderr)
              sys.exit(1)

          # 3. Check buildInfo
          build_info = data.get("buildInfo", {})
          run_number = build_info.get("workflowRunNumber", "")
          commit = build_info.get("commitHash", "")
          print(f"✅ BUILD INFO: Actions Run #{run_number} | Commit {commit}")
          print(f"✅ ALL VALIDATIONS PASSED: today.json is valid, fresh ({date_in_file}), and contains all required sections!")
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'my-morning-brief-apple-design'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # BUGFIX: Telegram notification now runs AFTER the page is actually live,
      # using the real deployed URL (steps.deployment.outputs.page_url) instead
      # of a hardcoded "your-username" placeholder that was never a real link.
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          cd my-morning-brief-apple-design && python scripts/notify_telegram.py
