name: Probe GitHub Models (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Official action
        id: ai
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          prompt: '用繁體中文寫一句處女座今日運勢，只輸出 JSON：{"s": "..."}'
      - name: Show action output
        run: echo "ACTION_OUTPUT=${{ toJSON(steps.ai.outputs.response) }}"
      - name: Raw curl
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -i --max-time 40 -X POST https://models.github.ai/inference/chat/completions \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"say hi in JSON {\"s\":...}"}],"response_format":{"type":"json_object"}}' | head -c 900
          echo; echo "--- python urllib"
          python3 - <<'PY'
          import os, json, urllib.request
          req = urllib.request.Request("https://models.github.ai/inference/chat/completions",
              data=json.dumps({"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"say hi"}]}).encode(),
              headers={"Content-Type":"application/json","Authorization":"Bearer "+os.environ["TOKEN"]})
          try:
              with urllib.request.urlopen(req, timeout=40) as r:
                  print(r.status, r.read()[:300])
          except Exception as e:
              print("ERR", e, getattr(e, "read", lambda: b"")()[:300])
          PY
