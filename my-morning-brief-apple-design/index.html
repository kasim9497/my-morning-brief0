<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="晨序">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>晨序</title>
  <!-- Debug 面板平常不顯示，網址後面加 ?debug 才出現 -->
  <script>
    if (location.search.indexOf('debug') !== -1) document.documentElement.classList.add('debug-on');
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <!-- 思源黑體放在專案裡自己供應，不依賴 Google 的字體服務；Apple 裝置會直接用系統字體，不會抓這份 -->
  <link rel="stylesheet" href="fonts/noto-sans-tc/noto-sans-tc.css">
</head>
<body>

  <!-- 導覽列（跨 tab 共用）：頂端透明，往下捲才浮出玻璃底和置中的小標題 -->
  <header class="masthead">
    <div class="container masthead-inner">
      <span class="navbar-title" id="navbar-title" aria-hidden="true">今日</span>
      <div class="header-actions">
        <button class="nav-btn" id="btn-refresh-brief" aria-label="重新整理晨報">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,4 3,9 8,9"/><polyline points="21,20 21,15 16,15"/><path d="M3.5 15a8.5 8.5 0 0 0 14.8 3.5M20.5 9A8.5 8.5 0 0 0 5.7 5.5"/></svg>
        </button>
        <button class="nav-btn nav-btn-accent" id="btn-open-chat" aria-label="開啟 AI 助理">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1-5.2A8 8 0 1 1 21 12Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 日期小字 + 大標題，跟著內容一起捲走；標題文字由 js/tabs.js 依分頁切換 -->
  <div class="container page-head">
    <h1 class="large-title" id="page-title">今日</h1>
    <p class="page-subtitle" id="header-date"></p>
  </div>

  <!-- ============ 5 個畫面容器 ============ -->
  <div id="view-container">

  <!-- ① 今日 -->
  <section id="view-today" class="view active">

  <main class="container">
    <!-- 只有連不上最新資料時才顯示 -->
    <p class="today-intro" id="stale-notice" hidden>連不上最新資料，目前顯示的是內建的範例內容</p>

    <!-- 排序依「今天早上該先看什麼」：語錄（一句話）→ 待辦（任務、倒數）→ 重點（天氣、星座、匯率）→ 練習（題庫） -->
    <div class="dashboard-grid">

      <!-- 今日語錄：職人精神/執行力主題，固定輪替，不是 AI 生成（避免捏造語錄） -->
      <article class="card col-span-2 tint-indigo">
        <div class="card-header">
          <h3 class="card-title">每日語錄</h3>
        </div>
        <div id="quote-banner-content"></div>
      </article>

      <!-- 太久沒備份才會出現（js/app.js 的 renderBackupReminder） -->
      <article class="card col-span-2" id="backup-reminder" hidden>
        <div class="list-row backup-reminder-row">
          <span id="backup-reminder-text"></span>
          <button type="button" class="section-action" data-goto="settings">去備份</button>
        </div>
      </article>

      <div class="section-head">
        <h2 class="section-title">待辦</h2>
        <button type="button" class="section-action" data-goto="settings">編輯</button>
      </div>

      <article class="card col-span-2 tint-orange">
        <div class="card-header">
          <h3 class="card-title">今日任務</h3>
          <span class="card-badge">依作息表產生</span>
        </div>
        <div id="tasklist-widget-content">
          <!-- Rendered dynamically -->
        </div>
      </article>

      <!-- 倒數摘要：只顯示，新增/刪除要去「倒數」頁 -->
      <article class="card col-span-2 tint-red">
        <div class="card-header">
          <h3 class="card-title">倒數</h3>
          <button type="button" class="section-action card-link" data-goto="countdown">管理</button>
        </div>
        <div id="today-countdown-widget-content">
          <!-- Rendered dynamically -->
        </div>
      </article>

      <div class="section-head">
        <h2 class="section-title">重點</h2>
      </div>

      <article class="card col-span-2 tint-teal">
        <div class="card-header">
          <h3 class="card-title">天氣</h3>
          <span class="card-badge" id="weather-card-badge">南京市栖霞區</span>
        </div>
        <div id="weather-widget-content">
          <!-- Rendered dynamically -->
        </div>
      </article>

      <article class="card tint-purple">
        <div class="card-header">
          <h3 class="card-title">處女座運勢</h3>
          <span class="card-badge" id="horoscope-card-badge"></span>
        </div>
        <div id="horoscope-widget-content">
          <!-- Rendered dynamically -->
        </div>
      </article>

      <article class="card tint-green">
        <div class="card-header">
          <h3 class="card-title">人民幣匯率</h3>
          <span class="card-badge">1 人民幣兌新台幣</span>
        </div>
        <div id="rate-widget-content">
          <!-- Rendered dynamically -->
        </div>
      </article>

      <div class="section-head">
        <h2 class="section-title">練習</h2>
      </div>

      <article class="card quiz-card col-span-2 tint-blue">
        <div class="card-header">
          <h3 class="card-title">機車駕照筆試</h3>
          <span class="card-badge" id="quiz-card-badge"></span>
        </div>
        <div id="quiz-widget-content">
          <!-- Rendered dynamically -->
        </div>
      </article>

    </div>
  </main>

  </section>
  <!-- ① 今日 結束 -->

  <!-- ② 週曆 -->
  <section id="view-calendar" class="view">
    <main class="container">
      <div class="view-placeholder">週曆 / 月曆（待實作）</div>
    </main>
  </section>

  <!-- ③ 倒數 -->
  <section id="view-countdown" class="view">
    <main class="container">
      <div class="view-placeholder">倒數（待實作）</div>
    </main>
  </section>

  <!-- ④ 睡眠 -->
  <section id="view-sleep" class="view">
    <main class="container">
      <div class="view-placeholder">睡眠（待實作）</div>
    </main>
  </section>

  <!-- ⑤ 設定 -->
  <section id="view-settings" class="view">
    <main class="container">
      <div class="view-placeholder">設定（待實作）</div>
    </main>
  </section>

  </div>
  <!-- ============ 5 個畫面容器 結束 ============ -->

  <!-- 底部浮動選單：圖示是實心的（跟 iOS 內建 App 的 tab bar 一樣），其他地方的圖示仍是線條 -->
  <nav class="tab-bar" role="tablist">
    <button class="tab-item active" data-view="today" role="tab">
      <span class="tab-icon"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4.6"/><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="2.2" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="21.8"/><line x1="2.2" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="21.8" y2="12"/><line x1="5.1" y1="5.1" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="18.9" y2="18.9"/><line x1="5.1" y1="18.9" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="18.9" y2="5.1"/></g></svg></span>
      <span class="tab-label">今日</span>
    </button>
    <button class="tab-item" data-view="calendar" role="tab">
      <span class="tab-icon"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M8 2a1 1 0 0 1 1 1v1h6V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1zM5 10v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8H5z"/><rect x="7" y="12" width="3" height="3" rx="0.8"/><rect x="11.5" y="12" width="3" height="3" rx="0.8"/></svg></span>
      <span class="tab-label">週曆</span>
    </button>
    <button class="tab-item" data-view="countdown" role="tab">
      <span class="tab-icon"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 2.5h11a1 1 0 0 1 .8 1.6L13.3 12l5 7.9a1 1 0 0 1-.8 1.6h-11a1 1 0 0 1-.8-1.6l5-7.9-5-7.9a1 1 0 0 1 .8-1.6z"/></svg></span>
      <span class="tab-label">倒數</span>
    </button>
    <button class="tab-item" data-view="sleep" role="tab">
      <span class="tab-icon"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.2a1 1 0 0 0-1.2-1.2 6.2 6.2 0 0 1-8.2-8.2 1 1 0 0 0-1.2-1.2 9 9 0 1 0 10.6 10.6z"/></svg></span>
      <span class="tab-label">睡眠</span>
    </button>
    <button class="tab-item" data-view="settings" role="tab">
      <span class="tab-icon"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span>
      <span class="tab-label">設定</span>
    </button>
  </nav>

  <!-- AI 助理：開啟按鈕在導覽列右上角 -->
  <div class="modal-overlay" id="modal-chat">
    <div class="modal-content chat-modal-content">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <h3 class="modal-title">AI 助理</h3>
        <button class="close-btn" id="btn-close-chat">&times;</button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <form class="chat-input-row" id="chat-input-form">
        <input type="text" class="chat-input" id="chat-input" placeholder="跟 AI 助理說些什麼…" autocomplete="off">
        <button type="submit" class="btn-action btn-primary chat-send-btn">送出</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <!-- Debug 面板：開發用，平常不顯示，網址後面加 ?debug 才會出現 -->
    <div id="debug-widget" class="debug-widget" aria-label="Debug Panel">
        <button id="debug-toggle" class="debug-toggle" title="展開/收合 Debug 面板">Debug</button>
        <div id="debug-panel" class="debug-panel" hidden>
          <div class="debug-title">目前資料來源</div>
          <div class="debug-grid">
            <span class="debug-label">日期</span>
            <span id="dbg-date" class="debug-val">—</span>

            <span class="debug-label">是否離線資料</span>
            <span id="dbg-stale" class="debug-val">—</span>

            <span class="debug-label">是否 mockData</span>
            <span id="dbg-mock" class="debug-val">—</span>

            <span class="debug-label">today.json 載入</span>
            <span id="dbg-json-status" class="debug-val">—</span>

            <span class="debug-label">today.json URL</span>
            <span id="dbg-json-url" class="debug-val debug-url">—</span>

            <span class="debug-label">GitHub Actions</span>
            <span id="dbg-run" class="debug-val">—</span>

            <span class="debug-label">Commit</span>
            <span id="dbg-commit" class="debug-val">—</span>

            <span class="debug-label">生成時間</span>
            <span id="dbg-generated" class="debug-val">—</span>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <!-- App Entry Script (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
